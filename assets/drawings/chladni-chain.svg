<svg class="drawing chladni-sheet" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chladni-svg-title chladni-svg-desc"><title id="chladni-svg-title">Chladni plate: signal chain and arrangement, drawn from the README and bill of materials</title><desc id="chladni-svg-desc">A: a signal source feeds a TPA3116D2 amplifier powered from 9 to 24 volts DC, which drives a 6.5 inch subwoofer; a threaded rod carries the vibration to a 200 by 200 by 1 millimetre aluminium plate. B: a side view, not to scale, of the planned stack: printed enclosure, subwoofer, centre rod, acrylic sheet on the outer rods, aluminium plate on top. Not built.</desc><defs><marker id="ch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" class="arrowhead-ink"/></marker></defs><text class="view-t" x="20" y="28">A  SIGNAL CHAIN</text><g class="v-group"><path class="v" pathLength="1" d="M20 58h150v70H20zM240 58h170v70H240zM480 58h150v70H480zM700 58h160v70H700zM250 178h150v40H250z"/><path class="v link" d="M170 93H236" marker-end="url(#ch-arrow)"/><path class="v link" d="M410 93H476" marker-end="url(#ch-arrow)"/><path class="v link" d="M630 93H696" marker-end="url(#ch-arrow)"/><path class="v link" d="M325 178V132" marker-end="url(#ch-arrow)"/></g><g class="labels"><text class="blk-t" x="95" y="86" text-anchor="middle">SIGNAL SOURCE</text><text class="blk-s" x="95" y="104" text-anchor="middle">laptop or</text><text class="blk-s" x="95" y="118" text-anchor="middle">microcontroller</text><text class="blk-t" x="325" y="86" text-anchor="middle">AMPLIFIER</text><text class="blk-s" x="325" y="104" text-anchor="middle">TPA3116D2 · XY-1001W</text><text class="blk-s" x="325" y="118" text-anchor="middle">100 W mono</text><text class="blk-t" x="555" y="86" text-anchor="middle">SUBWOOFER</text><text class="blk-s" x="555" y="104" text-anchor="middle">6.5 in coaxial</text><text class="blk-s" x="555" y="118" text-anchor="middle">driver</text><text class="blk-t" x="780" y="86" text-anchor="middle">PLATE</text><text class="blk-s" x="780" y="104" text-anchor="middle">aluminium</text><text class="blk-s" x="780" y="118" text-anchor="middle">200 × 200 × 1 mm</text><text class="blk-s" x="325" y="203" text-anchor="middle">DC supply 9–24 V</text><text class="link-t" x="203" y="84" text-anchor="middle">audio</text><text class="link-t" x="443" y="84" text-anchor="middle">speaker</text><text class="link-t" x="663" y="84" text-anchor="middle">rod</text></g><text class="view-t" x="460" y="190">B  ARRANGEMENT FROM THE ASSEMBLY STEPS · NOT TO SCALE</text><g class="v-group"><path class="v" pathLength="1" d="M500 300V392H800V300M560 330H740L705 372H595zM632 372h36v14h-36zM650 330V236M575 330V282M725 330V282M520 240H780M555 288H745"/><path class="h" d="M500 316H800"/><path class="v" d="M644 250h12v-6h-12zM644 232h12v-6h-12zM569 296h12v-6h-12zM719 296h12v-6h-12z"/></g><g class="callouts"><g class="callout"><path class="leader" d="M780 240L835 214"/><circle class="leader-dot" cx="780" cy="240" r="2"/><text class="call-t" x="838" y="212">1</text></g><g class="callout"><path class="leader" d="M745 288L835 262"/><circle class="leader-dot" cx="745" cy="288" r="2"/><text class="call-t" x="838" y="260">2</text></g><g class="callout"><path class="leader" d="M725 310L835 304"/><circle class="leader-dot" cx="725" cy="310" r="2"/><text class="call-t" x="838" y="308">3</text></g><g class="callout"><path class="leader" d="M705 350L835 346"/><circle class="leader-dot" cx="705" cy="350" r="2"/><text class="call-t" x="838" y="350">4</text></g><g class="callout"><path class="leader" d="M800 380L835 388"/><circle class="leader-dot" cx="800" cy="380" r="2"/><text class="call-t" x="838" y="392">5</text></g></g><g class="legend"><text class="call-t" x="20" y="262">1</text><text class="call-s" x="36" y="262">Aluminium plate, 200 × 200 × 1 mm, on the centre rod</text><text class="call-t" x="20" y="284">2</text><text class=