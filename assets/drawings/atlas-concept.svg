<svg class="drawing atlas-sheet" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atlas-svg-title atlas-svg-desc"><title id="atlas-svg-title">ATLAS: conceptual hydrogen-line receive chain</title><desc id="atlas-svg-desc">Conceptual only. A one-metre dish focuses radio waves onto a feed, followed by a low-noise amplifier, a band-pass filter, a software-defined radio and a computer that looks for the 1420.4 megahertz hydrogen line. No components have been chosen.</desc><defs><marker id="at-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" class="arrowhead-ink"/></marker></defs><g class="v-group concept"><path class="v" pathLength="1" d="M30 60Q75 110 30 160M60 110H96M150 85h110v50H150zM310 85h110v50H310zM470 85h110v50H470zM630 85h110v50H630z"/><path class="v link" d="M96 110H146M260 110H306M420 110H466M580 110H626" marker-end="url(#at-arrow)"/><path class="h" d="M30 60L96 110L30 160"/></g><g class="labels"><text class="blk-t" x="30" y="182">DISH · 1 m</text><text class="blk-t" x="205" y="115" text-anchor="middle">FEED</text><text class="blk-t" x="365" y="115" text-anchor="middle">LNA</text><text class="blk-t" x="525" y="115" text-anchor="middle">FILTER</text><text class="blk-t" x="685" y="115" text-anchor="middle">SDR</text><text class="blk-t" x="760" y="115">1420.4 MHz</text></g></svg>
