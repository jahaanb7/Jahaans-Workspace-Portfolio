<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" class="sketch sketch-verlet" role="img" aria-labelledby="verlet-t verlet-d">
<title id="verlet-t">Order of operations in one velocity Verlet step</title>
<desc id="verlet-d">A timeline from t to t plus delta t. Step 1 moves the position with the old velocity and acceleration, step 2 recomputes the acceleration at the new position, step 3 updates the velocity with the average of the old and new accelerations.</desc>
