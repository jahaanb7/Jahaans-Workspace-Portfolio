<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" class="sketch sketch-orbital-radial" role="img" aria-labelledby="orbitalradial-t orbitalradial-d">
<title id="orbitalradial-t">Radial probability of the hydrogen 1s, 2s and 2p states</title>
<desc id="orbitalradial-d">Hand-drawn plot of P(r) = r squared times the radial wavefunction squared, against r in Bohr radii from 0 to 14. 1s peaks at r = 1, 2p at r = 4, and 2s has a node at r = 2 and its main peak near r = 5.2.</desc>
